[workspace]
resolver = "3"
members = [
    "crates/voxcell-core",
    "crates/voxcell-hermes",
    "crates/voxcell-halftone",
    "crates/voxcell-store",
    "crates/voxcell-audio",
    "crates/voxcell-ui",
    "crates/voxcell-app",
    "crates/voxcell-uphill",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

# Required by anomalyco/rune: Cargo ignores `[patch.crates-io]` inside path
# dependencies, so top-level workspace mirrors RUNE's patched crates.
[patch.crates-io]
wgpu-hal = { path = "../third_party/rune/vendor/wgpu-hal" }
winit = { path = "../third_party/rune/vendor/winit" }
sctk-adwaita = { path = "../third_party/rune/vendor/sctk-adwaita" }
parley_engine = { path = "../third_party/rune/vendor/parley_engine" }
accesskit_windows = { path = "../third_party/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "../third_party/rune/vendor/accesskit_macos" }

[workspace.dependencies]
rune = { path = "../third_party/rune/crates/rune", features = ["svg"] }
rune-kit = { path = "../third_party/rune/crates/rune-kit" }
rune-fx = { path = "../third_party/rune/crates/rune-fx" }
rune-motion = { path = "../third_party/rune/crates/rune-motion" }
rune-notify = { path = "../third_party/rune/crates/rune-notify" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
rustfft = "6"
cpal = "0.15"
bytemuck = { version = "1", features = ["derive"] }
keyring = "3"
axum = "0.8"
rand = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.voxcell-halftone]
opt-level = 3
